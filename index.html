:root{--bg:#eef3f4;--card:#fff;--tx:#2b5964;--mut:#5f7f88;--ac:#3d7a87;--bd:#c9d8dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10191c;--card:#18262a;--tx:#d6e8ec;--mut:#8fb0b8;--ac:#5fa3b1;--bd:#2c4248}}
:root[data-theme="dark"]{--bg:#10191c;--card:#18262a;--tx:#d6e8ec;--mut:#8fb0b8;--ac:#5fa3b1;--bd:#2c4248}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px;font-weight:600}
p.s{margin:0 0 20px;color:var(--mut);font-size:.95rem}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
input{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%;box-sizing:border-box}
input:focus{outline:2px solid var(--ac)}
button{font:inherit;font-weight:600;padding:12px 18px;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}.row button{flex:1}
canvas,img#out{width:100%;height:auto;border-radius:8px;border:1px solid var(--bd);display:block}
#out{display:none}

const c=document.getElementById('c'),x=c.getContext('2d'),n=document.getElementById('n'),
dl=document.getElementById('dl'),out=document.getElementById('out'),msg=document.getElementById('msg');
const img=new Image();let ready=false;
function tc(v){return v.trim().replace(/\s+/g,' ').toLowerCase().replace(/(^|[\s\-'’.])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase())}
function draw(){
  if(!ready)return;
  x.clearRect(0,0,c.width,c.height);x.drawImage(img,0,0);
  const t=tc(n.value);
  if(!t)return;
  let s=84;const maxW=720;
  x.fillStyle='#3d7a87';x.textAlign='center';x.textBaseline='alphabetic';
  do{x.font=s+'px CertScript';s-=2}while(x.measureText(t).width>maxW&&s>20);
  x.fillText(t,792,490);
}
function refresh(){draw();dl.disabled=!(ready&&n.value.trim());
  if(n.value.trim()){out.src=c.toDataURL('image/png');out.style.display='block';c.style.display='none'}
  else{out.style.display='none';c.style.display='block'}}
img.onload=()=>{ready=true;refresh()};img.src=SRC;
let tm;n.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{c.style.display='block';out.style.display='none';draw();dl.disabled=!n.value.trim();clearTimeout(tm);tm=setTimeout(refresh,400)},0)});
if(document.fonts){document.fonts.load('40px CertScript').then(()=>refresh()).catch(()=>{})}
dl.addEventListener('click',async()=>{
  try{await document.fonts.load('40px CertScript')}catch(e){}
  draw();
  const name=(tc(n.value).replace(/[^\p{L}\p{N} _-]/gu,'').replace(/\s+/g,'-')||'participant');
  const fn='SEAN-Quiz-Certificate-'+name+'.png';
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  let d=null;try{d=window.claude&&await claude.use('downloads')}catch(e){}
  if(d){try{await d.save({filename:fn,data:blob});return}catch(e){if(e&&e.code==='declined')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();
});
